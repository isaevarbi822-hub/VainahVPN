name: Read-only live integrations probe
on:
  pull_request:
    paths:
      - '.github/workflows/public-integration-probe.yml'
jobs:
  check-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect only published public API statuses
        env:
          PUBLIC_STATUS_URL: https://vainahvpn-python-preview.onrender.com/api/site/services
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          url = os.environ["PUBLIC_STATUS_URL"]
          req = urllib.request.Request(url, headers={
              "User-Agent": "VainahVPN-PublicStatusProbe/1.0",
              "Accept": "application/json",
              "Cache-Control": "no-cache",
          })
          print("Probe UTC:", datetime.now(timezone.utc).isoformat())
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
                  print("HTTP:", response.status)
          except urllib.error.HTTPError as error:
              print("HTTP:", error.code)
              raise SystemExit(1)
          except Exception as error:
              print("Request failed:", type(error).__name__)
              raise SystemExit(1)
          services = payload.get("services", {})
          for key in ("database", "h1", "rollypay", "webhook"):
              service = services.get(key) or {}
              status = str(service.get("status", "missing"))
              print(key + ".status:", status[:50])
              if key in ("rollypay", "webhook"):
                  # These messages are explicitly public and sanitized by the API.
                  print(key + ".message:", str(service.get("message", ""))[:300])
          PY
