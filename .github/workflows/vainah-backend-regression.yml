name: Vainah Python regression tests
on:
  push:
    branches:
      - feat/restore-site-rollypay-checkout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test tools
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q backend/vainah backend/tests
      - name: Run regression tests
        working-directory: backend
        run: python -m pytest -q
