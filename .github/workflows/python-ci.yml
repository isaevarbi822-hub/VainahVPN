name: Python backend checks
on:
  push:
    branches: [main, feat/python-platform-foundation, feat/unified-android-python, feat/restore-site-rollypay-checkout]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vainah_test
          POSTGRES_PASSWORD: test_only_local_password
          POSTGRES_DB: vainah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vainah_test -d vainah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VAINAH_TEST_DATABASE_URL: postgresql://vainah_test:test_only_local_password@127.0.0.1:5432/vainah_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and test
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m compileall -q vainah
          ruff check vainah tests
      - name: Check syntax of every website and tooling JavaScript file
        shell: bash
        run: |
          # Previously this was a hand-maintained 25-file list with
          # duplicates, silently skipping many newer pages/controllers.
          count=0
          while IFS= read -r -d '' source; do
            node --check "$source"
            count=$((count + 1))
          done < <(find storefront web scripts -type f \\( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \\) -print0)
          echo "JavaScript syntax checked: $count files"
          test "$count" -gt 0
